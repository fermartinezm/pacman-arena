name: trace
on:
  workflow_dispatch:
    inputs:
      games:
        description: 'space separated layout:seed:apexcolour (e.g. jumboCapture:2:blue)'
        default: 'jumboCapture:2:blue'
      team:
        default: 'my_team.py'
      window:
        description: 'step range for per-move decision log, e.g. 140-230'
        default: ''
jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install frozendict
      - name: traces
        shell: pwsh
        run: |
          foreach ($g in "${{ inputs.games }}".Split(" ")) {
            $p = $g.Split(":")
            if ($p[2] -eq "blue") { $r = "agents/External/heuristic_cp312/heuristic_team.py"; $b = "${{ inputs.team }}" } else { $r = "${{ inputs.team }}"; $b = "agents/External/heuristic_cp312/heuristic_team.py" }
            Write-Output "################ $g"
            $env:WINDOW = "${{ inputs.window }}"; python tools/trace.py $r $b $p[0] $p[1] 25 2>&1 | Select-String -NotMatch "track enemy"
          }
